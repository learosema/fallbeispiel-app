# Lokal:      docker compose up --build              → http://localhost:8000
# Öffentlich: docker compose --profile public up -d  → https://$DOMAIN (Caddy holt das Zertifikat)
# Einrichtung siehe README.md, Abschnitt „Öffentlich betreiben“.
services:
  app:
    build: .
    ports:
      # Nur von diesem Rechner aus erreichbar; von außen geht es über Caddy (HTTPS).
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Heruntergeladene Hugging-Face-Modelle überleben Neustarts
      - hf-cache:/models
    restart: unless-stopped

  caddy:
    profiles: [public]
    image: caddy:2.8.4
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
    restart: unless-stopped

volumes:
  hf-cache:
  caddy-data:
