# docker compose up -d --build  → http://127.0.0.1:8000
# Öffentlich: Reverse Proxy (z. B. nginx) davor, siehe README.md „Öffentlich betreiben“.
services:
  app:
    build: .
    ports:
      # Nur von diesem Rechner aus erreichbar; von außen geht es über den Reverse Proxy (HTTPS).
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Heruntergeladene Hugging-Face-Modelle überleben Neustarts
      - hf-cache:/models
    restart: unless-stopped

volumes:
  hf-cache:
