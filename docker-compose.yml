# docker compose up -d --build  → http://127.0.0.1:8000 (bzw. APP_PORT aus .env)
# Öffentlich: Reverse Proxy (z. B. nginx) davor, siehe README.md „Öffentlich betreiben“.
services:
  app:
    build: .
    ports:
      # Host:Container. Nur von diesem Rechner aus erreichbar (127.0.0.1) – von außen geht es über den Reverse Proxy.
      # Den Host-Port ändert APP_PORT in .env; im Container lauscht die App immer auf 8000.
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      # Heruntergeladene Hugging-Face-Modelle überleben Neustarts
      - hf-cache:/models
    restart: unless-stopped

volumes:
  hf-cache:
