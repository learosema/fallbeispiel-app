[project]
name = "fallbeispiel-app"
version = "0.1.0"
description = "Fallbeispiel-Trainer: regelbasierte Simulation und Auswertung, FastAPI-Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "transformers>=4.46",
    "torch>=2.4",
    "pyyaml>=6.0.3",
    "piper-tts>=1.3",
    "lameenc>=1.8",
]

[tool.uv]
package = false

# CPU-Build von PyTorch (spart ~2 GB CUDA-Pakete). Für NVIDIA-GPUs diesen Block entfernen.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
