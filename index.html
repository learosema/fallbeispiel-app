<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fallbeispiel xABCDE</title>
  <meta name="theme-color" content="#b3261e">
  <meta name="description" content="Fallbeispiele nach xABCDE üben – per Sprache.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="xABCDE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" hidden aria-label="Zurück">←</button>
    <h1 id="title">Fallbeispiel xABCDE</h1>
    <button id="settingsBtn" class="icon-btn" aria-label="Einstellungen">⚙︎</button>
  </header>

  <main>
    <!-- Startseite -->
    <section id="home">
      <p class="lead">Wähle ein Schema-Problem. Du sprichst, die App antwortet als Patient:in bzw. Umstehende.</p>
      <div id="scenarioList" class="scenario-list"></div>
    </section>

    <!-- Einsatz -->
    <section id="session" hidden>
      <div id="log" class="log" aria-live="polite"></div>
      <div id="status" class="status"></div>
      <form id="inputBar" class="input-bar" autocomplete="off">
        <button type="button" id="micBtn" class="mic" aria-label="Sprechen">🎤</button>
        <input id="textInput" type="text" placeholder="Sprich oder tippe …" enterkeyhint="send">
        <button type="submit" id="sendBtn" class="send" aria-label="Senden">➤</button>
      </form>
      <div class="actions">
        <label class="toggle"><input type="checkbox" id="handsfree"> Freisprechen</label>
        <button type="button" id="debriefBtn" class="secondary">Auswertung</button>
      </div>
    </section>
  </main>

  <dialog id="settings">
    <form method="dialog" id="settingsForm">
      <h2>Einstellungen</h2>
      <label>API-Basis-URL
        <input id="baseUrl" type="url" placeholder="https://api.openai.com/v1" autocapitalize="off" spellcheck="false">
      </label>
      <label>API-Key
        <input id="apiKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <label>Modell
        <input id="model" type="text" placeholder="z. B. gpt-4o-mini" autocapitalize="off" spellcheck="false">
      </label>
      <label>Sprechtempo <output id="rateOut">1.0</output>
        <input id="rate" type="range" min="0.7" max="1.5" step="0.05" value="1">
      </label>
      <label class="toggle"><input type="checkbox" id="speak"> Antworten vorlesen</label>
      <p class="hint">Der Key bleibt nur in diesem Browser (localStorage) und geht direkt an den Endpunkt. Der Endpunkt muss CORS erlauben.</p>
      <menu>
        <button value="cancel" class="secondary">Abbrechen</button>
        <button value="save" id="saveSettings">Speichern</button>
      </menu>
    </form>
  </dialog>

  <script src="algorithm.js"></script>
  <script src="scenarios.js"></script>
  <script src="app.js"></script>
</body>
</html>
