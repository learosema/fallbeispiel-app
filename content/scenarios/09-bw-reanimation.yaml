id: bw-reanimation
group: Bewusstlosigkeit
letter: HLW
title: Bewusstlos, keine Atmung
teaser: Reanimation mit AED
dispatch: "Funkmeldung: Laufveranstaltung an der Außenalster, Läufer zusammengebrochen und reagiert nicht, Umstehende haben nichts unternommen."
debrief_notes: >
  Läufer (ca. 52), Kreislaufstillstand mit Kammerflimmern, nur Schnappatmung (= nicht normal). Erwartet: Ansprechen, Atemwege frei,
  Atemkontrolle max. 10 s, Schnappatmung als nicht normal erkennen, sofort HLW 30:2 – sobald Beutel und Maske dran sind, zählt, wer drückt, laut bis 30, dann 2 Beatmungen durch den Kollegen (vorher nur drücken), Nachforderung RTW + NEF (ohne Nachforderung kommt
  niemand). Der Kollege baut nacheinander an: AED, Beatmung (Beutel + Maske, Raumluft), Absaugbereitschaft, Sauerstoff, ggf. Guedel-Tubus. Der AED analysiert alle 2 Minuten und empfiehlt jedes Mal einen Schock;
  beim Schock „Schock! Alle weg!“. Durchgehend reanimieren mit minimalen Pausen und Helferwechsel bei der Analyse, bis RTW und NEF
  übernehmen – ein Wiedererlangen des Kreislaufs ist ohne erweiterte Maßnahmen (z. B. Adrenalin) nicht zu erwarten und wird nicht gespielt.
  Am Ende strukturierte Übergabe: Zeitpunkt des Kollaps, Beginn der HLW, Anzahl der Schocks, Vorgeschichte (Brustschmerz am Morgen).

conscious: false
breathing: abnormal
request: {required: [RTW, NEF]}
funk_early: [atemkontrolle, atmung_beurteilen]   # keine normale Atmung: Notruf sofort (Kollege), parallel HLW
skip: [waerme]   # während der HLW stört eine Decke
state: {aed_kommt: false, aed_dran: false, analyse_offen: false, beatmung_moeglich: false, absaug_bereit: false, o2_bereit: false, guedel: false, rd_da: false}

responses:
  rekap:
    - Befund: Nicht beurteilbar – kein Kreislauf.
  zyanose:
    - Befund: Lippen und Gesicht blau-livide.
  af_zaehlen:
    - Befund: Keine eigene Atmung.
  temperatur:
    - Kollege: Nicht jetzt – wir drücken.
  bodycheck:
    - Befund: Keine äußeren Verletzungen.
  trauma_check:
    - Kollege: Nicht jetzt – wir drücken.
  alter_fragen:
    - Umstehende: Ich kenn ihn nicht … Anfang fünfzig?
  lage_pruefen:
    - Befund: "Weg direkt am Wasser, trocken, 12 °C, etwa 20 Zuschauer, die Strecke ist hier gesperrt. Keine akute Gefahr, aber Gaffer drängen nach. Ein Betroffener liegt auf dem Weg. Der Betroffene ist ein sportlicher Mann, etwa Anfang fünfzig."
  blutung_pruefen:
    - Befund: Keine Blutung.
  vorstellen:
    - Befund: (keine Reaktion)
    - Umstehende: (aufgelöst) Er ist einfach umgefallen, mitten im Laufen!
  laut_ansprechen:
    - Befund: Keine Reaktion auf Ansprechen und Rütteln.
  schmerzreiz:
    - Befund: Keine Reaktion auf Schmerzreiz.
  was_passiert:
    - Umstehende: Er ist mitten im Lauf umgekippt, nicht gestolpert, nicht auf den Kopf gefallen. Seitdem bewegt er sich nicht.
  atemkontrolle:
    - when: {hlw: false}
      say:
        - Befund: Keine normale Atmung, nur vereinzelte schnappende Atemzüge. Haut blass-livide.
    - say:
        - Befund: Keine eigene Atmung.
  puls:
    - Befund: Kein Puls tastbar.
  nachforderung:
    - Kollege: (setzt über Funk den Notruf ab und fordert RTW und NEF an)
  hlw:
    - when: {aed_kommt: false}
      say:
        - Befund: (Herzdruckmassage läuft)
        - Kollege: (holt den AED, schaltet ihn ein und klebt die Elektroden rechts unter dem Schlüsselbein und links seitlich unter der Achsel)
      set: {aed_kommt: true}
    - say:
        - Befund: (Herzdruckmassage läuft)
  beatmen:
    - when: {beatmung_moeglich: true}
      say:
        - Kollege: (gibt zwei Beatmungen mit dem Beutel)
        - Befund: (der Brustkorb hebt sich zweimal)
    - say:
        - Kollege: Beutel ist noch nicht dran – weiterdrücken.
  atemwege_freimachen:
    - when: {guedel: true}
      say:
        - Befund: Guedel-Tubus liegt, die Atemwege sind frei.
    - say:
        - Befund: Kopf überstreckt, Kinn angehoben, die Atemwege sind frei.
  hlw_30:   # wer drückt, zählt laut; ab Beatmungsmöglichkeit beatmet der Kollege bei „30“
    - when: {beatmung_moeglich: true}
      say:
        - Kollege: (gibt zwei Beatmungen mit dem Beutel)
        - Befund: (der Brustkorb hebt sich zweimal)
    - say: []
  aed:
    - when: {aed_dran: true}
      say:
        - Kollege: AED ist dran.
    - when: {aed_kommt: true}
      say:
        - Kollege: Bin dabei.
    - say:
        - Kollege: (holt den AED und schaltet ihn ein)
  absaugen:
    - when: {absaug_bereit: true}
      say:
        - Kollege: Ist bereit.
    - say:
        - Kollege: Absaugbereitschaft hergestellt.
      set: {absaug_bereit: true}
  sauerstoff:
    - when: {o2_bereit: true}
      say:
        - Kollege: Ist angeschlossen.
    - say:
        - Kollege: Sauerstoff ist angeschlossen.
      set: {o2_bereit: true}
  schock_warnung:   # „Schock! Alle weg!“ – zählt für die Auswertung, braucht keine eigene Antwort
    - say: []
  schock_ausloesen:
    - when: {analyse_offen: true}
      say:
        - AED: Schock wird abgegeben.
        - Befund: (der Körper zuckt kurz zusammen)
        - AED: Schock abgegeben. Beginnen Sie jetzt mit der Herz-Lungen-Wiederbelebung.
      set: {analyse_offen: false}
    - say:
        - Kollege: Der AED hat keinen Schock freigegeben.
  helferwechsel:
    - Kollege: (übernimmt die Herzdruckmassage)
  platz_schaffen:
    - Umstehende: (die Zuschauer weichen zurück)
  seitenlage:
    - Kollege: Seitenlage? Er atmet doch nicht!
  spo2:
    - Befund: Kein Messwert.
  rr:
    - Befund: Nicht messbar.
  gcs:
    - Befund: GCS 3.
  pupillen:
    - Befund: Pupillen weit.
  bz:
    - Kollege: Nicht jetzt – wir drücken.
  hautfarbe:
    - Befund: Haut blass-livide.
  decke:
    - Kollege: Erst mal weiterdrücken.
  sample_vorerkrankung:
    - Umstehende: Ein Freund von ihm meinte, er hatte heute Morgen Brustschmerzen. Und er nimmt was gegen Bluthochdruck.
  sample_medikamente:
    - Umstehende: Irgendwas gegen Bluthochdruck.
  sample_allergie:
    - Umstehende: Weiß ich nicht.
  sample_mahlzeit:
    - Umstehende: Keine Ahnung.
  reevaluation:
    - Befund: Weiterhin keine Atmung, kein Puls.
  uebergabe:
    - when: {rd_da: true}
      say:
        - Rettungsdienst: Danke. Wir übernehmen, ihr drückt bitte weiter, bis wir so weit sind.
      set: {uebergeben: true}
    - say:
        - Kollege: Der Rettungsdienst ist noch nicht da – weiterdrücken.

events:
  - at: 40
    when: {hlw: false}
    say:
      - Befund: Die Schnappatmung wird seltener, die Haut immer blauer.
  # Während der ersten Herzdruckmassage baut der Kollege nacheinander an: AED, Beatmung (Beutel + Maske,
  # zunächst Raumluft), Absaugbereitschaft, Sauerstoff, ggf. Guedel-Tubus. Der AED analysiert alle 2 Minuten,
  # bis der Rettungsdienst übernimmt. Kammerflimmern bleibt – ohne erweiterte Maßnahmen (Adrenalin …) kein ROSC.
  - at: 15
    since: hlw
    say:
      - Kollege: AED ist dran.
    set: {aed_dran: true}
  - at: 15
    since: hlw
    repeat: 120
    when: {rd_da: false}
    say:
      - AED: Patient nicht berühren! Herzrhythmus wird analysiert …
      - AED: Schock empfohlen. Blinkende Taste drücken.
    set: {analyse_offen: true}
  - at: 25
    since: hlw
    when: {beatmung_moeglich: false}
    say:
      - Kollege: Beutel mit Maske ist dran, Beatmung mit Raumluft möglich.
    set: {beatmung_moeglich: true}
  - at: 35
    since: hlw
    when: {absaug_bereit: false}
    say:
      - Kollege: Absaugbereitschaft hergestellt.
    set: {absaug_bereit: true}
  - at: 45
    since: hlw
    when: {o2_bereit: false}
    say:
      - Kollege: Sauerstoff ist angeschlossen.
    set: {o2_bereit: true}
  - at: 55
    since: hlw
    when: {guedel: false}
    say:
      - Kollege: Guedel-Tubus liegt.
    set: {guedel: true}
  - at: 50
    since: hlw
    repeat: 120
    when: {analyse_offen: true, rd_da: false}
    say:
      - AED: Blinkende Taste drücken.
  # RTW und NEF kommen ca. 8 Minuten nach der Nachforderung – ohne Nachforderung kommt niemand.
  - at: 480
    since: nachforderung
    say:
      - Rettungsdienst: Rettungsdienst und Notarzt sind da. Was habt ihr bisher gemacht?
    set: {rd_da: true}
  # ENTWURF Eskalation – Zeiten und Befunde fachlich gegenlesen
  - at: 120
    when: {hlw: false}
    say:
      - Befund: Keine Atemzüge mehr, die Haut ist grau-blau.
  - at: 300
    when: {hlw: false}
    say:
      - Befund: Ohne Herzdruckmassage ist es zu spät – der Läufer ist verstorben.
    set: {verstorben: true}
    expect: false

# ENTWURF Eskalation
silence:
  - when: {hlw: false}
    say:
      - Umstehende: Macht doch was! Der atmet nicht!
alone:
  - say:
      - Umstehende: Ihr könnt doch jetzt nicht gehen! Hilfe!

key_actions:
  - label: Schnappatmung als nicht normal erkannt, sofort HLW
    any: [hlw]
    critical: true
    within: 60
  - label: Notruf / Nachforderung RTW + NEF
    any: [nachforderung]
    critical: true
    within: 90
  - label: Sobald beatmet werden kann, laut bis 30 gezählt, dann 2 Beatmungen
    all: [hlw_zaehlen, hlw_30]
    after: beatmung_moeglich
  - label: Sicherheit beim Schock („Schock! Alle weg!“)
    any: [schock_warnung]
    before: [schock_ausloesen]
  - label: Helferwechsel
    phase: full
    any: [helferwechsel]
  - label: Strukturierte Übergabe an RTW/NEF
    phase: full
    any: [uebergabe]
