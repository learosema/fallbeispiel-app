id: mil-pyro-asthma
group: Millerntor (FC St. Pauli)
letter: B
title: Pyro-Rauch im Block, Atemnot
teaser: Asthma + dichter Rauch
dispatch: "Funkmeldung Millerntor: Im Stehplatzblock wurde Pyrotechnik gezündet, eine Frau hat starke Atemnot und hustet."
debrief_notes: >
  Sophie (29), Asthma, Spray vergessen, Rauch im Block. Erwartet: Eigenschutz (Rauch, Funken, Gedränge), Patientin aus dem Rauch bringen,
  aufrecht lagern, Atemanweisung, O2, Pulsoxi (bei Rauch mit Vorsicht deuten), Auskultation, Heiserkeit/Rußspuren als Warnzeichen
  (Inhalationstrauma?), SAMPLER inkl. Spray, Rettungsdienst nachfordern, Reevaluation.

# Stimmen fürs Vorab-Vertonen (Beschreibung für Qwen3-TTS, siehe content/voices.yaml)
voices:
  Patient: A 29-year-old German woman, native German speaker, short of breath and hoarse from smoke, coughing, anxious. Declarative sentences end with a clearly falling intonation.
  Umstehende: A German woman around thirty, native German speaker, football fan and the patient's friend, agitated and loud. Declarative sentences end with a clearly falling intonation. Speaks standard German with a native German accent, no English or American accent.
  # Referenz fürs Casting vorgegeben (Anfang wurde verschluckt bzw. Fremdwörter in allen Zeilen)
  reference:
    Umstehende: "Da hinten hat jemand was gezündet, und der ganze Rauch kam zu uns. Sie hat Asthma. Ihr Medikament liegt im Auto!"

conscious: true
trauma: false
request: {required: [RTW], optional: [NEF]}
funk_early: [atmung_fragen, atmung_beurteilen]   # schwere Atemnot: Notarzt früh
skip: [hws]

responses:
  atmung_beurteilen:
    - Befund: Atmung angestrengt, ca. 30/min, Einsatz der Atemhilfsmuskulatur, Pfeifen beim Ausatmen, Husten, sie spricht nur in Halbsätzen.
  alter_fragen:
    - Patient: Neunund… zwanzig.
  lage_pruefen:
    - Befund: "Stehplatzblock, dichte Rauchwolke, schlechte Sicht, laute Stimmung. Einige bengalische Feuer brennen noch, Funkenflug, Gedränge. Eine Betroffene sitzt am Rand auf einer Stufe, ihr Freund Ole sucht ihr Spray. Die Betroffene ist eine junge Frau, etwa Ende zwanzig."
  aus_gefahr_bringen:
    - Kollege: (hilft, Sophie aus dem Rauch in den Umlauf zu bringen)
    - Befund: An der frischen Luft wird der Hustenreiz etwas weniger.
  platz_schaffen:
    - Umstehende: (machen widerwillig Platz)
  blutung_pruefen:
    - Befund: Keine Blutung.
  vorstellen:
    - Patient: (hustet) Hilfe … Luft …
  was_passiert:
    - Umstehende: Da wurde Pyro gezündet und der ganze Rauch kam zu uns. Sie hat Asthma, und ihr Spray liegt im Auto!
  beschwerden_fragen:
    - Patient: Brust … eng …
  beruhigen:
    - Patient: (nickt, panisch)
  atemanweisung:
    - Patient: (versucht langsamer auszuatmen)
  oberkoerper_hoch:
    - Befund: (sitzt aufrecht, stützt die Arme ab)
  atemwege_freimachen:
    - Befund: Atemwege frei, leichte Heiserkeit, Rußspuren am Mundwinkel.
  atmung_fragen:
    - Patient: Nein … schlecht …
  schmerz_atmen:
    - Patient: Nicht … Schmerz … eng.
  zyanose:
    - Befund: Lippen leicht bläulich.
  af_zaehlen:
    - Befund: Atemfrequenz 30, Einsatz der Atemhilfsmuskulatur.
  spo2:
    - when: {sauerstoff: false}
      say:
        - Befund: SpO2 91 %.
    - say:
        - Befund: SpO2 94 % unter Sauerstoff.
  auskultation:
    - Befund: Beidseits exspiratorisches Giemen.
  sauerstoff:
    - Kollege: (legt die Sauerstoffmaske an)
  hautfarbe:
    - Befund: Haut warm, feucht.
  puls:
    - Befund: Puls schnell, regelmäßig, gut tastbar, ca. 122.
  rekap:
    - Befund: Rekap unter 2 Sekunden.
  rr:
    - Befund: RR 135/85.
  gcs:
    - Befund: Wach, GCS 15, ängstlich.
  orientierung:
    - Patient: Sophie … Stadion.
  pupillen:
    - Befund: Pupillen isokor.
  bz:
    - Befund: BZ 104 mg/dl.
  frieren_fragen:
    - Patient: Nein.
  decke:
    - Patient: (nickt)
  temperatur:
    - Befund: Temperatur 36,8 °C.
  bodycheck:
    - Befund: Augen tränen und sind gerötet, keine Verbrennungen.
  auge:
    - Befund: Augen gerötet und tränend, sie sieht auf beiden Augen scharf.
  sample_allergie:
    - Patient: Keine.
  sample_medikamente:
    - Umstehende: Salbutamol, aber das liegt im Auto!
  sample_vorerkrankung:
    - Patient: Asthma … seit Kind.
  sample_mahlzeit:
    - Patient: Vor drei Stunden … zwei Bier.
  reevaluation:
    - when: {aus_gefahr_bringen: true, sauerstoff: true}
      say:
        - Befund: Atemfrequenz 26, SpO2 94 %, etwas längere Sätze möglich.
    - say:
        - Befund: Atemnot unverändert, SpO2 89 %.

events:
  - at: 60
    when: {aus_gefahr_bringen: false}
    say:
      - Befund: Der Rauch zieht weiter über euch, Sophie hustet stärker und wird erschöpft.
  - at: 150
    when: {aus_gefahr_bringen: false}
    say:
      - Befund: SpO2 sinkt, sie kann kaum noch sprechen.
  # ENTWURF Eskalation – Zeiten und Befunde fachlich gegenlesen
  - at: 240
    when: {aus_gefahr_bringen: false}
    say:
      - Befund: Sophie wird schläfrig, die Lippen sind blau, sie atmet flach.
  - at: 330
    when: {aus_gefahr_bringen: false}
    say:
      - Befund: Sophie sackt zusammen und reagiert nicht mehr. Nur noch vereinzelte, schnappende Atemzüge.
    set: {bewusstlos: true, keine_normale_atmung: true}
    expect: {any: [aus_gefahr_bringen, laut_ansprechen, atemkontrolle, hlw], within: 15, label: Bewusstlosigkeit erkannt – raus aus dem Rauch}
    request: [NEF]   # ab hier ist der Notarzt nötig
  - at: 450
    when: {aus_gefahr_bringen: false, hlw: false}
    say:
      - Befund: Sophie hat aufgehört zu atmen. Im Rauch ist es zu spät – sie ist verstorben.
    set: {verstorben: true}
    expect: false

# ENTWURF Eskalation
silence:
  - say:
      - Patient: (hustend, keuchend) Ich … krieg … keine Luft …
alone:
  - say:
      - Patient: (keuchend) Nicht … weggehen …
      - Umstehende: Hey! Ihr könnt sie doch nicht hier im Rauch lassen!

smalltalk:
  befinden:
    - when: {aus_gefahr_bringen: false}
      say:
        - Patient: (hustet) Nein … der Rauch …
    - say:
        - Patient: (hustet, nickt) Etwas … besser.

patient_smalltalk:
  - say:
      - Patient: (hustet, nickt nur)

key_actions:
  - label: Eigenschutz und Patientin aus dem Rauch gebracht
    any: [aus_gefahr_bringen]
    critical: true
    within: 60
  - label: Aufrechte Lagerung und Atemanweisung
    any: [oberkoerper_hoch, atemanweisung]
  - label: Sauerstoff nach SpO2
    phase: full
    all: [spo2, sauerstoff]
  - label: Heiserkeit/Ruß als Warnzeichen geprüft
    any: [atemwege_freimachen]
  - label: Reevaluation
    phase: full
    any: [reevaluation]
