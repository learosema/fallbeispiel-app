# Checklisten für die Auswertung.
#
# Je Punkt:
#   all: [a, b, [c, d]]   alle Elemente nötig (ein Element in [] = eines davon reicht); teilweise → ⚠️
#   any: [a, b]           eines reicht
#   any_extra: {cond: [c]} weitere Elemente für `any`, wenn die Bedingung gilt
#   min: n + of: [...]    mindestens n Elemente
#   only: trauma | bleeding | conscious | unconscious | breathing_normal | breathing_abnormal
#   extra: {trauma: [...]} zusätzliche Elemente, wenn die Bedingung für den Fall gilt
#   special: funk | reevaluation
#   unless_skipped: {waerme: [decke]}  Elemente entfallen, wenn der Fall den Punkt per `skip` ausblendet
#   unordered: true  zählt nicht für die Reihenfolge („außer der Reihe“)
#   tip: was der Kollege auf Nachfrage sagt, solange der Punkt offen ist („Hast du einen Tipp?“).
#        Keine verborgenen Befunde verraten.
# Fälle können einzelne Punkte per `skip: [id]` ausblenden („–“).

minute_conscious:
  - {id: lage, short: Lage, label: "Sicherheit und Lage", any: [lage_pruefen], tip: "Ist die Einsatzstelle eigentlich sicher? Schau dich mal um."}
  - {id: blutung, short: Blutung, label: "Bedrohliche Blutung geprüft", any: [blutung_pruefen], tip: "Hast du schon nach einer bedrohlichen Blutung geschaut?"}
  - {id: ansprache, short: Ansprache, label: "Vorstellung und Ansprache (Hallo, wir sind vom DRK, was ist passiert?)", all: [vorstellen, was_passiert], tip: "Wollen wir uns vorstellen und fragen, was passiert ist?"}
  - {id: hws, short: HWS, label: "HWS bei Trauma (manuelle Stabilisierung)", any: [hws_manuell], only: trauma, tip: "Denk beim Unfallhergang an die HWS."}
  - {id: atmung, short: Atmung, label: "Atmung (Luft? Schmerzen beim Atmen? Zyanose?)", all: [[atmung_fragen, atmung_beurteilen], schmerz_atmen, zyanose], tip: "Wie sieht es mit der Atmung aus? Luft, Schmerzen beim Atmen, Zyanose?"}
  - id: kreislauf
    tip: "Hast du dir den Kreislauf schon angeschaut? Hautfarbe, Puls, Rekap."
    short: Kreislauf
    label: Kreislauf (Hautfarbe, Puls, Rekap-Zeit, bei Trauma Bauch/Becken/Oberschenkel)
    all: [hautfarbe, puls, rekap]
    extra: {trauma: [trauma_check]}
  - id: neuro
    short: Reaktion
    label: "Neurologie: Reaktion angemessen? (fällt beim Ansprechen auf; wenn auffällig, in Teambesprechung und Funkspruch nennen)"
    any: [reaktion, gcs]
    any_extra: {reaction_normal: [vorstellen, laut_ansprechen]}   # unauffällig: mit dem Ansprechen erledigt, nicht extra nennen
    unordered: true   # kein eigener Schritt: gilt auch, wenn die Reaktion in Teambesprechung oder Funkspruch genannt wird
    tip: "Wie reagiert die Person – angemessen? Wenn nicht, gehört das in Teambesprechung und Funkspruch."
  - {id: umfeld, short: Umfeld, label: "Umfeld (Verletzungsmechanismus, Frieren)", any: [frieren_fragen, decke], tip: "Und das Umfeld? Friert die Person?"}
  - {id: waerme, short: Wärme, label: "Wärmeerhalt (Decke, Isolation vom Boden)", any: [decke], tip: "Denk an den Wärmeerhalt."}
  - id: team
    short: Team
    label: "Teambesprechung (Patient, Reaktion, Verdacht, Nachforderung – „Siehst du das auch so?“)"
    any: [teambesprechung]
    special: team
    tip: "Lass uns kurz besprechen: Patient, Reaktion, dein Verdacht, was brauchen wir? Und frag mich, ob ich das auch so sehe."
  - {id: funk, short: Funk, label: "Funkspruch an die Leitstelle", special: funk, tip: "Sollen wir die Leitstelle anfunken?"}

minute_unconscious:
  - {id: lage, short: Lage, label: "Sicherheit und Lage", any: [lage_pruefen], tip: "Ist die Einsatzstelle eigentlich sicher? Schau dich mal um."}
  - {id: blutung, short: Blutung, label: "Bedrohliche Blutung geprüft", any: [blutung_pruefen], tip: "Hast du schon nach einer bedrohlichen Blutung geschaut?"}
  - {id: ansprechen, short: Ansprechen, label: "Laut ansprechen, anfassen, ggf. Schmerzreiz", any: [laut_ansprechen, schmerzreiz], tip: "Reagiert die Person? Sprich sie laut an, fass sie an."}
  - {id: atemwege, short: Atemwege, label: "Atemwege freimachen (Kopf überstrecken, Kinn anheben)", any: [atemwege_freimachen], tip: "Denk an die Atemwege: Kopf überstrecken, Kinn anheben."}
  - {id: atemkontrolle, short: Atemkontrolle, label: "Atemkontrolle (sehen, hören, fühlen, max. 10 s)", any: [atemkontrolle, atmung_beurteilen], tip: "Atmet die Person? Sehen, hören, fühlen."}
  - {id: seitenlage, short: Seitenlage, label: "Atmung normal: stabile Seitenlage", any: [seitenlage], only: breathing_normal, tip: "Du hast die Atmung kontrolliert. Was folgt daraus?"}
  - {id: hlw, short: HLW, label: "Atmung nicht normal: sofort HLW 30:2", any: [hlw], only: breathing_abnormal, tip: "Du hast die Atmung kontrolliert. Was folgt daraus?"}
  - {id: waerme, short: Wärme, label: "Wärmeerhalt (Decke, Isolation vom Boden)", any: [decke], tip: "Denk an den Wärmeerhalt."}
  - {id: funk, short: Funk, label: "Funkspruch an die Leitstelle", special: funk, tip: "Sollen wir die Leitstelle anfunken?"}

full:
  - {id: x, short: x, label: "x – Extreme Blutung", any: [blutung_pruefen], extra: {bleeding: [blutung_stillen]}, tip: "Ist mit Blutungen alles erledigt?"}
  - {id: a, short: A, label: "A – Airway (Atemwege beurteilt)", any: [atemwege_freimachen, atemkontrolle, atmung_fragen, atmung_beurteilen], tip: "Sind die Atemwege beurteilt?"}
  - {id: b, short: B, label: "B – Breathing (Atemfrequenz, SpO2, Auskultation)", all: [af_zaehlen, spo2, auskultation], tip: "Machen wir B: Atemfrequenz, Sättigung, abhören?"}
  - {id: c, short: C, label: "C – Circulation (Puls, Blutdruck, Rekap-Zeit)", all: [puls, rr, rekap], tip: "Weiter mit C: Puls, Blutdruck, Rekap?"}
  - id: d
    short: D
    label: "D – Disability (Bewusstsein, Pupillen, Blutzucker; wenn wach: Orientierung, BE-FAST)"
    all: [gcs, pupillen, bz]
    extra: {conscious: [orientierung, fast]}
    unless_skipped: {bz: [bz]}   # `skip: [bz]`: kein BZ erwartet (während der HLW hat Drücken Vorrang)
    tip: "Dann D: Bewusstsein, Pupillen, Blutzucker – und wenn ansprechbar: Orientierung und BE-FAST?"
  - id: e
    tip: "Fehlt noch E: SAMPLER, Bodycheck, Wärmeerhalt?"
    short: E
    label: E – Exposure/Environment (SAMPLER, Ganzkörperuntersuchung, Wärmeerhalt)
    all: [[sample_allergie, sample_medikamente, sample_vorerkrankung, sample_mahlzeit, sample_risiko, sample], bodycheck, decke]
    unless_skipped: {waerme: [decke]}   # wach im Warmen bzw. HLW: auch im E keine Decke erwarten
  - id: sample
    tip: "Ist die SAMPLER-Anamnese schon komplett?"
    short: SAMPLER
    label: SAMPLER (Symptome, Allergien, Medikamente, Patientenvorgeschichte, Letzte Mahlzeit/Stuhlgang, Ereignis, Risikofaktoren)
    min: 5
    of: [beschwerden_fragen, sample_allergie, sample_medikamente, sample_vorerkrankung, sample_mahlzeit, was_passiert, sample_risiko]
  - {id: reevaluation, short: Reevaluation, label: "Reevaluation (erneut beurteilt bzw. wieder bei A begonnen)", special: reevaluation, tip: "Wollen wir noch mal kontrollieren, ob unsere Maßnahmen wirken?"}
  - {id: uebergabe, short: Übergabe, label: "Strukturierte Übergabe an den Rettungsdienst (z. B. ISOBAR oder SINNHAFT)", any: [uebergabe], special: uebergabe, tip: "Wenn der Rettungsdienst da ist, braucht er eine strukturierte Übergabe – wer, was ist passiert, Befunde, Anamnese, Maßnahmen, Verdacht, Fragen?"}

# Befundsprache: Ein Teilsatz über einen Befund gilt als „vage“, wenn er diesen Beispielen per Embedding
# deutlich ähnlicher ist als den konkreten Befunden und den reinen Handlungen/Fragen.
# Ergänzen, wenn etwas falsch erkannt wird – je Gruppe kurze, typische Sätze.
# Teambesprechung (an den Kollegen, oft mehrteilig, Abschluss „Siehst du das auch so?“): Bausteine im gesamten Text
team_talk:
  - label: Patient (Geschlecht, ungefähres Alter)
    patterns: [männlich, weiblich, '\bherr\b', '\bfrau\b', '\bmann\b', patient, '\d+', jahr, jährig, '\balt\b', älter, jung, mitte, anfang, ende]
  - label: Reaktion (auffällig?)
    only: reaction_abnormal   # nur Auffälliges nennen (10-für-10: Problem, Fakten, Plan) – „reagiert angemessen“ muss nicht sein
    patterns: [reagiert, reaktion, ansprechbar, '\bwach\b', bewusstlos, bewusstsein, orientiert, verwirrt, somnolent, eingetrübt, '\bgcs\b', adäquat, angemessen]
  - label: Verdacht
    patterns: [verdacht, vermutlich, wahrscheinlich, '\bv ?a\b', problem, gehe von .* aus]
  - label: Nachforderung (RTW / Notarzt?)
    patterns: ['\brtw\b', '\bnef\b', notarzt, rettungsdienst, nachforder, '\bktw\b']

# Abschlussfrage der Teambesprechung an den Kollegen: Regex in der Engine (TEAM_CLOSE) und per Embedding gegen
# diese Beispiele – der letzte Teilsatz muss ihnen deutlich ähnlicher sein als den Aussagesätzen darunter.
team_close:
  questions:
    - Siehst du das auch so?
    - Sehe ich das richtig?
    - Bist du einverstanden?
    - Was meinst du dazu?
    - Passt das für dich?
    - Stimmst du mir zu?
    - Hast du noch etwas zu ergänzen?
    - Habe ich etwas vergessen?
    - Teilst du meine Einschätzung?
    - Bist du auch der Meinung?
    - Kannst du das so mittragen?
    - Wie siehst du das?
    - Sind wir uns einig?
    - Kommst du zum selben Ergebnis?
    - Noch was von deiner Seite?
    - Würdest du das genauso einschätzen?
  statements:
    - Wir haben einen Patienten, männlich, Ende sechzig
    - Kopfanprall
    - Schmerzen im Nacken
    - Verdacht auf ein HWS-Trauma
    - Wir brauchen RTW und NEF
    - Puls ist schnell und gut tastbar
    - Er reagiert angemessen
    - Sie hat keine Allergien

# Übergabe an den Rettungsdienst: Bausteine, die ISOBAR (Identify, Situation, Observations, Background,
# Assessment/Actions, Responsibility/Read-back) und SINNHAFT gemeinsam haben. Geprüft wird der gesamte Text der
# (mehrteiligen) Übergabe; je Baustein reicht ein Treffer (bei `min` so viele verschiedene Treffer).
handover:
  - label: Patient (Geschlecht, Alter, ggf. Name)
    patterns: [männlich, weiblich, '\bherr\b', '\bfrau\b', '\bmann\b', patient, '\d+ ?jahr', jährig, '\balt\b', älter, jung, mitte (zwanzig|dreißig|vierzig|fünfzig|sechzig|siebzig|achtzig)]
  - label: Ereignis / Situation
    patterns: [passiert, gestürzt, sturz, gefallen, ausgerutscht, gestoßen, angeschlagen, abgerutscht, verletzt, gestolpert, getrunken, gerutscht, aufgefunden, gefunden, unfall, hergang, verschluckt, zusammengebrochen, kollabiert, gekrampft, seit, plötzlich, ereignis, situation]
  - label: Befunde (ABCDE, Vitalwerte)
    min: 2
    patterns: [atemweg, atmung, atemfrequenz, '\baf\b', spo2, sättigung, puls, '\brr\b', blutdruck, rekap, gcs, bewusst, '\bbz\b', blutzucker, pupille, temperatur, haut, '\bfast\b', orientiert]
  - label: Anamnese (SAMPLER – Allergien, Medikamente, Vorerkrankungen …)
    patterns: [allergi, medikament, blutverdünner, vorerkrank, vorgeschichte, bekannt, nimmt, letzte mahlzeit, gegessen, sampler, diabet, asthma]
  - label: Maßnahmen
    patterns: [angelegt, gegeben, gelagert, zugedeckt, stabilisiert, versorgt, verbunden, gekühlt, abgesaugt, beatmet, gedrückt, reanimiert, tourniquet, sauerstoff, decke, seitenlage, schocklage, '\bhlw\b', '\baed\b', geschockt, maßnahme, haben wir, wurde]
  - label: Einschätzung / Verdacht
    patterns: [verdacht, vermutlich, wahrscheinlich, einschätzung, '\bv ?a\b', gehe von .* aus, denke]
  - label: Uhrzeit des Tourniquets
    if_intent: tourniquet      # nur, wenn eines angelegt wurde
    patterns: ['\d{1,2} ?[:.] ?\d{2}', '\d{1,2} uhr', 'um \d', 'seit \d', 'vor \d+ minuten', 'seit \w+ minuten']
  - label: Rückfragen / Übergabe der Verantwortung
    patterns: [fragen, rückfrage, übernehm, übernehmt, übergeben, '\bdas wars\b', das wäre alles, das war alles]

finding_language:
  vague:
    - Puls ist normal
    - Puls ist okay
    - Puls ist gut
    - Kreislauf passt
    - Kreislauf ist stabil und in Ordnung
    - Haut sieht unauffällig aus
    - Hautfarbe ist normal
    - Rekap ist okay
    - Blutdruck ist im Normbereich
    - Die Werte sind alle gut
    - Vitalwerte sind normal
    - Sättigung ist in Ordnung
  concrete:
    - Puls regelmäßig und gut tastbar
    - Puls gut tastbar
    - Puls schnell und schwach tastbar
    - Puls nicht tastbar
    - Puls etwa 80, regelmäßig, kräftig
    - Rekap unter zwei Sekunden
    - Rekapillarisierungszeit verzögert
    - Rekap verlängert
    - Haut blass und kaltschweißig
    - Haut rosig und warm
    - Blutdruck 130 zu 80
    - Sättigung 97 Prozent
    - Atemfrequenz 16 pro Minute
  action:
    - Ich fühle den Puls
    - Ich messe den Blutdruck
    - Ich schaue mir die Haut an
    - Ich prüfe die Rekapillarisierungszeit
    - Ich lege das Pulsoxymeter an
    - Kannst du bitte den Blutdruck messen?
    - Wie ist der Puls?
    - Wie ist die Hautfarbe?
    - Ich untersuche Sie von Kopf bis Fuß, auch die Haut, ob Sie einen Ausschlag haben
    - Ich schaue, ob die Haut gerötet oder geschwollen ist
