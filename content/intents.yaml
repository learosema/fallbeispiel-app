# Intent-Katalog für die Simulation.
#
# Je Intent:
#   label     Name in der Auswertung („Fehlt: …“)
#   patterns  Regex auf kleingeschriebenen Text (ß wird zu ss). Ein Treffer reicht.
#   examples  Beispielsätze für die Embedding-Erkennung (Umschreibungen ohne Stichwort)
#   default   Antwort, wenn der Fall selbst keine festlegt (Varianten mit when/set möglich)
#   implies   gilt automatisch mit als erledigt (ohne eigene Antwort)
#   overrides wird dieser Intent erkannt, entfallen die genannten
#   exclusive wird dieser Intent erkannt, entfallen alle anderen der Äußerung
#   fallback  hat der Fall keine Antwort, gilt die Antwort des Falls auf diese Intents („Atmung?“ → Atemkontrolle)
#   unconscious  Antwort, wenn die Person bewusstlos ist und der Fall selbst nichts festlegt
# Reihenfolge: Antwort des Falls → unconscious → fallback → default → Kollege fragt nach.
#
# Die Funk-Intents (funk_anruf, funk_meldung, funk_ende) erkennt die Engine selbst anhand der Rufnamen.

# ---------------------------------------------------------------- keine Handlung
# Füllsätze ohne fachlichen Inhalt. Liegt eine Äußerung näher an diesen Beispielen (oder nicht
# deutlich vor ihnen), wird kein Intent erkannt und der Kollege fragt nach – besser als falsch raten.
# Nur für die Embedding-Erkennung, nie als Treffer.
smalltalk:
  label: Keine fachliche Handlung
  examples:
    - Okay
    - Alles klar
    - Ja
    - Nein danke
    - Moment bitte
    - Einen Augenblick
    - Ich mache weiter
    - Das machen wir jetzt so
    - Ich komme gleich
    - Warte kurz
    - Gut so
    - Verstanden
    - Kannst du mir das mal geben?
    - Halt mal kurz
    - Was ist das hier?
    - Schauen wir mal
    - Ich überlege kurz
    - Äh, also
    - Weiter geht's

# ---------------------------------------------------------------- Patient allein lassen
# Das ganze Team geht weg: Der Patient ist allein (Flag `allein`), wache Patient:innen rufen um Hilfe, Fälle können
# darauf mit schnellerer Verschlechterung reagieren. Wer danach etwas am Patienten macht, ist automatisch wieder da.
weggehen:
  label: Patient allein gelassen
  patterns:
    - wir (gehen|laufen|holen|müssen) (kurz |mal |schnell |eben )*(\w+ ){0,4}(zum|zu unserem|ans|zurück zum|zurück zu|aus dem|vom) (auto|fahrzeug|wagen|rtw|ktw|einsatzfahrzeug|sanitätszelt|zelt|sanraum)
    - (kollege|kollegin),? (komm|kommst du) (mal |kurz |bitte )*mit
    - wir (lassen|lass) (sie|ihn|dich|euch) (kurz |mal |eben )*(allein|alleine)
    - wir sind (gleich|kurz|sofort) (wieder )?(da|zurück)
  examples:
    - Wir holen kurz noch was aus dem Auto
    - Wir lassen Sie kurz allein
  default:
    - say:
        - Befund: (Ihr lasst den Patienten allein.)
      set: {allein: true}

kurz_weg:  # nur ich gehe – der Kollege bleibt beim Patienten
  label: Kurz weg (Kollege bleibt)
  patterns:
    - ich (geh|gehe|lauf|laufe|hol|hole) (kurz |mal |schnell |eben )*(\w+ ){0,4}(zum|zu unserem|ans|zurück zum|aus dem|vom) (auto|fahrzeug|wagen|rtw|ktw|einsatzfahrzeug|sanitätszelt|zelt|sanraum)
  examples:
    - Ich gehe kurz zum Auto
  default:
    - Kollege: Geh ruhig, ich bleibe hier.

zurueck:
  label: Zurück beim Patienten
  patterns:
    - (wir sind|ich bin|bin|sind) (wieder )?(da|zurück)( (bei ihnen|bei dir))?$
    - so,? (wir sind|ich bin|da sind wir|da bin ich) wieder
    - da (sind wir|bin ich) wieder
  examples:
    - So, wir sind wieder da
  default:
    - when: {allein: true}
      say:
        - Befund: (Ihr seid wieder beim Patienten.)
      set: {allein: false}
    - set: {allein: false}

# ---------------------------------------------------------------- Sicherheit / Lage
lage_pruefen:
  label: Sicherheit und Lage
  patterns:
    - \blage\b
    - \bsicher(heit)?\b
    - gefahr
    - eigenschutz
    - umgebung
    - (schaue?|guck\w*|seh\w*) (mich |uns )?um
    - umschauen|umsehen
    - wie viele (betroffene|verletzte|patienten|personen)
    - (weitere|noch mehr|andere) (betroffene|verletzte|patienten)
  examples:
    - Ist die Einsatzstelle sicher?
    - Ich schaue mir die Umgebung an
    - Gibt es Gefahren für uns?
    - Wie viele Verletzte gibt es?
    - Ich verschaffe mir einen Überblick

handschuhe:
  label: Eigenschutz (Handschuhe)
  patterns:
    - handschuh
  examples:
    - Ich ziehe mir Einmalhandschuhe an
  default:
    - Kollege: (zieht ebenfalls Handschuhe an)

platz_schaffen:
  label: Platz schaffen / Umstehende lenken
  patterns:
    - platz (machen|schaffen|da|bitte)
    - (mach|machen|schafft|schaffen) (sie |ihr |mal |bitte )*platz
    - \babstand\b
    - (bitte )?(treten sie|gehen sie|geht) (bitte )?(\w+ ){0,2}(zurück|weg|weiter|zur seite)
    - (brauchen|brauche) (\w+ )?platz
    - zurücktreten
    - gaffer|schaulustig
    - absperr
  examples:
    - Bitte gehen Sie ein Stück zurück
    - Können Sie hier bitte Platz machen?
    - Alle bitte etwas Abstand
  default:
    - Umstehende: (treten ein Stück zurück)

polizei:
  label: Polizei hinzuziehen
  patterns:
    - polizei
  examples:
    - Wir brauchen die Polizei hier
  default:
    - Kollege: (gibt über Funk an die Einsatzleitung weiter, dass die Polizei benötigt wird)

aus_gefahr_bringen:
  label: Aus dem Gefahrenbereich bringen
  patterns:
    - aus dem (rauch|qualm|gefahrenbereich|block|wasser|wald)
    - an die frische luft
    - frische luft
    - in sicherheit bringen
    - in den schatten
    - (raus|weg) aus dem
    - (weg|raus)bringen
    - (weg|raus)tragen
    - rettung aus
  examples:
    - Wir bringen sie hier raus aus dem Rauch
    - Lass uns ihn in Sicherheit bringen
  default:
    - Kollege: (hilft, die Person vorsichtig aus dem Gefahrenbereich zu bringen)

rucksack:
  label: Material holen
  patterns:
    - rucksack
    - (hol|bring)\w* (\w+ ){0,3}(rucksack|material|ausrüstung|koffer|tasche)
    - (rucksack|material|ausrüstung) (holen|bringen)
  examples:
    - Kannst du das Material holen?
  default:
    - Kollege: (stellt den Sanitätsrucksack bereit)

# ---------------------------------------------------------------- x – bedrohliche Blutung
blutung_pruefen:
  label: Bedrohliche Blutung geprüft
  patterns:
    - \bblut(ung|ungen|et|en)?\b
    - blutungs?check
    - bedrohlich\w* blut
    - spritz
    - blutlache
  examples:
    - Ich schaue nach starken Blutungen
    - Blutet er irgendwo?
    - Keine lebensbedrohliche Blutung zu sehen

blutung_stillen:  # Oberbegriff – Abdrücken, Druckverband und Tourniquet zählen mit (implies)
  label: Blutstillung (Abdrücken / Druckverband / Tourniquet)
  implies: [blutung_pruefen]
  overrides: [wunde_versorgen]
  patterns:
    - (blutung|wunde) (stillen|stoppen)
    - (stille|stoppe) (die )?blutung
    - wunde (aus)?tamponier|tamponade
    - (kümmer|versorg)\w* (\w+ ){0,3}(die |der )?blutung
  examples:
    - Wir müssen die Blutung stillen
    - Kümmere dich um die Blutung
  default:
    - Befund: (die Blutung wird gestoppt)

abdruecken:  # vorübergehend, bis ein Verband sitzt
  label: Blutung abgedrückt
  implies: [blutung_stillen, blutung_pruefen]
  fallback: [blutung_stillen]
  patterns:
    - abdrück
    - (fest |kräftig )?drauf ?drücken
    - druck auf die wunde
    - (blutung|wunde) (komprimieren|abdrücken)
    - komprimier
    - drück\w* (\w+ ){0,4}ab\b
  examples:
    - Ich drücke die Wunde fest ab
    - Drück mal kräftig drauf
  default:
    - Befund: (die Blutung wird gestoppt)

druckverband:  # Standard bei starker Blutung an Arm oder Bein
  label: Druckverband
  implies: [blutung_stillen, blutung_pruefen]
  overrides: [wunde_versorgen]
  fallback: [blutung_stillen]
  patterns:
    - druckverband|druck ?verband
    - druckpolster
    - (zweiten|noch einen|weiteren) (druck)?verband
  examples:
    - Druckverband anlegen
    - Ich lege einen Druckverband an
  default:
    - Befund: (die Blutung wird gestoppt)

tourniquet:  # wenn der Druckverband nicht reicht
  label: Tourniquet
  implies: [blutung_stillen, blutung_pruefen]
  overrides: [wunde_versorgen]
  fallback: [blutung_stillen]
  patterns:
    - tourniquet|tourniket|turnicket|torniquet|turniquet
    - abbind
  examples:
    - Ich lege sofort ein Tourniquet oberhalb der Wunde an
    - Tourniquet anlegen
  default:
    - Befund: (die Blutung wird gestoppt)

# ---------------------------------------------------------------- Ansprache
vorstellen:
  label: Vorstellung (Name / Organisation)
  patterns:
    - \bdrk\b|deutsch\w* rot\w* kreuz|vom roten kreuz|rotes kreuz
    - wir sind (vom|die|der|hier)
    - mein name ist|ich heisse|ich bin (die|der) \w+
    - sanitätsdienst|sanitäter
    - \bhallo\b|guten (tag|abend|morgen)|\bmoin\b|servus
  examples:
    - Hallo, wir sind vom Sanitätsdienst
    - Guten Tag, ich bin Lea vom DRK
    - Wir sind hier, um Ihnen zu helfen
  default:
    - Patient: Hallo …

was_passiert:
  label: Nach dem Hergang gefragt
  unconscious:
    - Befund: (keine Reaktion)
  patterns:
    - was ist (denn |genau |eigentlich |hier |denn genau )?(passiert|los|geschehen)
    - (wissen|weisst|wisst) (sie|du|ihr),? (was|wie) (\w+ ){0,3}(passiert|geschehen) ist
    - (hat|haben) (jemand|sie|ihr) (gesehen|mitbekommen),? (was|wie) (\w+ ){0,3}(passiert|umgefallen|gestürzt|zusammengebrochen)
    - was (war|ist) (denn )?los
    - wie ist das passiert
    - was (haben sie|hast du|hat er|hat sie) gemacht
    - hergang
    - unfallhergang
    - (erzählen|erzähl) sie (mir )?(was|mal)
    - was genau ist
    - wie (kam|kommt) es (dazu)?
    - wie es (dazu )?(kam|gekommen)
  examples:
    - Was ist denn passiert?
    - Können Sie mir erzählen, wie das passiert ist?
    - Was ist hier los?

laut_ansprechen:
  label: Laut ansprechen / an den Schultern rütteln
  patterns:
    - hören sie mich|hörst du mich|können sie mich hören|kannst du mich hören
    - (augen|auge) auf
    - aufwachen
    - rüttel
    - an den schultern
    - laut ansprech
    - sprech\w* (ihn|sie) (laut )?an
    - reagiert (er|sie)
    - (hallo|he),? (hallo|he)
  examples:
    - Hallo, können Sie mich hören?
    - Ich spreche ihn laut an und rüttle an den Schultern
  default:
    - Patient: Ja … ich höre Sie.

schmerzreiz:
  label: Schmerzreiz gesetzt
  patterns:
    - schmerzreiz
    - kneif
    - trapezius
    - (reiz|schmerz) setzen
  examples:
    - Ich setze einen Schmerzreiz am Trapezmuskel
  default:
    - Patient: Au! Was soll das?

beschwerden_fragen:
  label: Nach Beschwerden gefragt
  unconscious:
    - Befund: (keine Reaktion)
  patterns:
    - (wo |was )(tut|tuts|schmerzt)
    - tut (ihnen|dir|es|irgendwas|was|etwas) (irgendwo |sonst )?weh
    - haben sie schmerzen|hast du schmerzen|schmerzen\?
    - beschwerden
    - wie geht es (ihnen|dir)|wie gehts
    - was fehlt (ihnen|dir)
    - wie fühlen sie sich|wie fühlst du dich
    - wie stark (sind|ist) (die |der |ihre |deine )?schmerz|schmerz\w* (\w+ ){0,3}(von )?(0|null) bis (10|zehn)
  examples:
    - Wo haben Sie Schmerzen?
    - Wie geht es Ihnen gerade?
    - Tut Ihnen etwas weh?

beruhigen:
  label: Beruhigt / Maßnahmen erklärt
  patterns:
    - beruhig
    - ganz ruhig|bleiben sie ruhig|bleib ruhig|keine (angst|sorge)
    - wir (sind|bleiben) (bei ihnen|da|hier)|ich bin (bei ihnen|da|hier)
    - wir (helfen|kümmern)
    - (ich|wir) (werde|werden) (jetzt )?(ihnen|dir)
    - ich erkläre
    - (sie|du) (sind|bist) in guten händen
    - alles wird gut
    - (sind|bin) (wir |ich )?(jetzt |ja |hier |nun )*für (sie|dich) da
    - (sagen sie|sag)( (mir|uns|bitte|einfach|sofort|bescheid))*,? (wenn|falls)
    - (ich bleibe|wir bleiben) (\w+ )?(bei ihnen|bei dir|bei ihm|bei ihr)
    - (wir lassen|ich lasse) (sie|dich) (\w+ )?nicht allein
    - (sie machen|du machst) das (sehr |richtig |echt |wirklich )?(gut|super|prima|toll)
    - (das haben sie|das hast du) (sehr |richtig |echt |wirklich )?(gut|super|prima|toll) gemacht
    - (kümmern|helfen) wir (uns )?(jetzt |gleich |gut )*(um sie|um dich|ihnen|dir)
  examples:
    - Keine Sorge, wir kümmern uns um Sie
    - Ich erkläre Ihnen kurz, was ich jetzt mache
    - Sie sind nicht allein, wir bleiben bei Ihnen
  default:
    - Patient: (nickt) Okay.

# ---------------------------------------------------------------- A
atemwege_freimachen:
  label: Atemwege freimachen / prüfen
  patterns:
    - überstreck
    - kinn (an)?heben|kinn hoch
    - kopf (nach hinten|in den nacken)
    - esmarch
    - atemwege? (frei|prüfen|checken|kontrollieren|sichern|freimachen|offen)
    - atemwege? (sind|ist) (\w+ )?(frei|offen)\b   # Befund „Atemwege sind frei“
    - (in den |den )?mund(raum)? (schauen|gucken|kontrollieren|inspizieren|öffnen|ausräumen|anschauen)
    - mundraum
    - (schaue|gucke) (in den|ihm in den|ihr in den) mund
    - fremdkörper im mund
    - guedel|wendl
  examples:
    - Ich mache die Atemwege frei, Kopf überstrecken
    - Ich schaue in den Mund, ob da was drin ist
    - Sind die Atemwege frei?

absaugen:
  label: Absaugen / Absaugbereitschaft
  patterns:
    - absaug
    - sauger
    - saug\w* (\w+ ){0,3}ab\b
  examples:
    - Mach mal die Absaugpumpe bereit
  default:
    - Kollege: (macht die Absaugpumpe bereit)

husten_auffordern:
  label: Zum Husten aufgefordert
  default:
    - Patient: (hustet kurz) Wieso? Ich hab mich nicht verschluckt.
  unconscious:
    - Befund: (keine Reaktion)
  patterns:
    - husten sie|hust(e|en)? (weiter|kräftig|fest)
    - kräftig husten|weiter husten
    - versuch\w* (\w+ ){0,2}zu husten
  examples:
    - Versuchen Sie kräftig zu husten!

rueckenschlaege:
  label: Rückenschläge
  default:
    - Patient: Hey, was soll das? Ich hab mich nicht verschluckt!
  unconscious:
    - Befund: Keine Veränderung.
  patterns:
    - rückenschl
    - schl\w+ (kräftig )?(zwischen|auf) (die|den) schulterbl
    - zwischen die schulterbl
    - auf den rücken (schlag|klopf)
    - (5|fünf) schläge
    - rücken\w* (\w+ ){0,2}(klop|schlag|schläg|hau)    # „Rücken klopfen“ (auch „klopen“)
    - \b(klop|schlag|schläg|hau)\w* (\w+ ){0,4}(auf|zwischen) (den|die) (rücken|schulterbl)
  examples:
    - Ich beuge ihn nach vorne und gebe fünf Schläge zwischen die Schulterblätter

heimlich:
  label: Oberbauchkompression (Heimlich)
  default:
    - Patient: Au! Was machen Sie da?
  unconscious:
    - Befund: Keine Veränderung.
  patterns:
    - heimlich
    - oberbauch(kompression|stö|stoss|stöss)
    - bauch(stoss|stöss|stöße|kompression)
  examples:
    - Ich mache jetzt den Heimlich-Handgriff

# ---------------------------------------------------------------- B
# Zwei verschiedene Dinge: die Frage an den Patienten („Bekommen Sie gut Luft?“) und die eigene
# Beurteilung der Atmung („Atmung?“, „Wie ist die Atmung?“) – die liefert einen Befund.
atmung_fragen:
  label: „Bekommen Sie gut Luft?“
  patterns:
    - (gut |genug |ausreichend )?luft\b
    - atemnot|luftnot|kurzatmig
    - (können|kannst) (sie|du) (gut |normal |frei )?atmen
    - wie geht es (ihnen |dir )?mit (dem atmen|der atmung)
    - (haben|hast) (sie|du) (\w+ ){0,2}(probleme|schwierigkeiten|mühe) (beim|mit dem) atmen
  examples:
    - Bekommen Sie gut Luft?
    - Haben Sie Probleme beim Atmen?
    - Können Sie normal atmen?
  unconscious:
    - Befund: (keine Reaktion)

atmung_beurteilen:
  label: Atmung beurteilt (Frequenz, Atemarbeit, Geräusche)
  fallback: [atemkontrolle, af_zaehlen]   # beim Bewusstlosen = Atemkontrolle
  unconscious:   # im Verlauf: Schnappatmung bzw. Kreislaufstillstand (Flags aus den Fällen)
    - when: {kreislaufstillstand: true}
      say:
        - Befund: Keine normale Atmung, nur vereinzelte schnappende Atemzüge.
    - when: {keine_normale_atmung: true}
      say:
        - Befund: Keine normale Atmung, nur vereinzelte schnappende Atemzüge.
  patterns:
    - ^\W*(und |die )?atmung\W*$                      # „Atmung?“
    - \b(wie|was) (\w+ ){0,3}(die |der )?atmung\b     # „Wie ist / beurteilst du die Atmung?“
    - atmung (beurteilen|beurteile|anschauen|ansehen|checken|prüfen)
    - (beurteile|schaue?|guck\w*|prüfe) (\w+ ){0,2}(die )?atmung
    - atmung (gut|normal|frei|unauffällig|ok|in ordnung|ruhig|schnell|flach|angestrengt)
    - atmet (normal|gut|ruhig|frei|schnell|flach)
    - atemarbeit|atemhilfsmuskulatur|atemmuster
  examples:
    - Wie ist die Atmung?
    - Ich beurteile die Atmung
    - Atmung ruhig und regelmäßig

schmerz_atmen:
  label: Schmerzen beim Atmen
  unconscious:
    - Befund: (keine Reaktion)
  patterns:
    - schmerz\w* beim (ein|aus)?atmen
    - beim (ein|aus)?atmen (weh|schmerz)
    - tut (das )?(ein|aus)?atmen weh
    - atemabhängig\w* schmerz
  examples:
    - Tut das Atmen weh?
    - Haben Sie Schmerzen beim Einatmen?

zyanose:
  label: Zyanose (Lippenfarbe)
  fallback: [hautfarbe]
  patterns:
    - zyano
    - lippe(?!nbremse)
    - bläulich|blau (angelaufen|verfärbt)
  examples:
    - Ich schaue auf die Lippenfarbe
    - Ist er blau im Gesicht?

af_zaehlen:
  label: Atemfrequenz
  fallback: [atemkontrolle]
  unconscious:   # im Verlauf: Schnappatmung bzw. Kreislaufstillstand (Flags aus den Fällen)
    - when: {kreislaufstillstand: true}
      say:
        - Befund: Keine normale Atmung, nur vereinzelte schnappende Atemzüge.
    - when: {keine_normale_atmung: true}
      say:
        - Befund: Keine normale Atmung, nur vereinzelte schnappende Atemzüge.
  patterns:
    - atemfrequenz
    - \baf\b
    - atemzüge
    - (zähl\w*|zähle) (die )?atmung
    - atmung (zählen|zähle)
  examples:
    - Ich zähle die Atemzüge pro Minute

spo2:
  label: Sauerstoffsättigung (SpO2)
  patterns:
    - spo ?2|\bsp ?o ?zwei\b
    - sättigung
    - puls ?ox
    - oxymet|oximet
    - fingerclip|clip an
    - (klammer|clip|klemme) an (den |ihren |deinen |seinen |ihrem |deinem |seinem )?finger
    - (misst|messe|messen) (\w+ ){0,2}sauerstoff
  examples:
    - Ich messe die Sättigung
    - Leg mal das Pulsoxymeter an

auskultation:
  label: Lunge abgehört (Auskultation)
  default:
    - Befund: Atemgeräusch beidseits gleich, keine Nebengeräusche.
  patterns:
    - abhör|abhören|\blunge\b
    - auskult
    - stethoskop
    - atemgeräusch
    - seitengleich
  examples:
    - Ich höre die Lunge mit dem Stethoskop ab

sauerstoff:
  label: Sauerstoffgabe
  patterns:
    - (?<!misst den )(?<!messe den )(?<!messen den )\bsauerstoff\b(?! weg)   # „die misst den Sauerstoff“ = SpO2
    - \bo ?2\b(?! weg)
    - sauerstoff(maske|gabe|brille)
    - (maske|nasenbrille) (auf|an)
    - \d+ liter
  examples:
    - Ich gebe ihr Sauerstoff über die Maske
  default:
    - Kollege: (bereitet den Sauerstoff vor und legt die Maske an)

oberkoerper_hoch:
  label: Oberkörper hoch / sitzende Lagerung
  patterns:
    - oberkörper\w* (\w+ ){0,2}(hoch|erhöht|aufrecht|anheben|hochlagern)
    - aufrecht
    - (hin|auf)setzen|sitzend\w*|sitzen (lassen|bleiben)
    - kutschersitz
    - (nach )?vorne (beugen|lehnen)|vornüber
    - (beugen|lehnen) sie (sich |den oberkörper |den kopf )?(\w+ )?nach vorn|beug dich (\w+ )?nach vorn
    - setzen sie sich|setz dich (hin|auf)?
    - halbsitzend|hochlagern
  examples:
    - Wir lassen sie aufrecht sitzen
    - Lagern Sie den Oberkörper hoch
  default:
    - Befund: (sitzt jetzt mit erhöhtem Oberkörper)

atemanweisung:
  label: Atemanweisung (Lippenbremse, ruhig atmen)
  patterns:
    - lippenbremse
    - (ruhig|langsam|tief) (ein- und aus|ein|aus)?atmen
    - atmen sie (\w+ ){0,2}(ruhig|langsam|mit mir|tief)
    - atme (ruhig|langsam|mit mir)
    - durch (die nase|den mund) (\w+ )?(ein|aus)\b
  examples:
    - Atmen Sie ganz langsam mit mir, durch die Nase ein und durch den Mund aus
  default:
    - Patient: (versucht, langsamer zu atmen)

halsvenen:
  label: Halsvenen beurteilt
  default:
    - Befund: Halsvenen nicht gestaut.
  patterns:
    - halsvene
    - gestaut
    - jugular
  examples:
    - Sind die Halsvenen gestaut?

# ---------------------------------------------------------------- C
hautfarbe:
  label: Hautfarbe / Hautzustand
  patterns:
    - hautfarbe|\bhaut\b|hautkolorit
    - \bblass|blässe
    - kaltschweiss|schweissig|schwitzt
    - gesichtsfarbe
    - rosig
  examples:
    - Wie sieht die Haut aus?
    - Er ist ziemlich blass

puls:
  label: Puls
  unconscious:
    - when: {kreislaufstillstand: true}
      say:
        - Befund: Kein Puls tastbar.
  patterns:
    - \bpuls(e|es)?\b(?!ox)
    - herzfrequenz|\bhf\b
    - radialis|karotis|carotis|halsschlagader
    - (fühl|tast|mess)\w* (den |ihren |seinen )?puls
  examples:
    - Ich fühle den Puls am Handgelenk
    - Wie ist die Herzfrequenz?

rekap:
  label: Rekapillarisierungszeit
  unconscious:
    - Befund: Rekap-Zeit unter 2 Sekunden.
  patterns:
    - rekap|recap|re-kap
    - kapillar
    - nagelbett|nagelprobe|fingernagel
  examples:
    - Ich drücke auf das Nagelbett und schaue, wie schnell es wieder rosig wird

rr:
  label: Blutdruck
  patterns:
    - blutdruck
    - \brr\b
    - manschette
  examples:
    - Ich messe den Blutdruck

trauma_check:
  label: Trauma-Check (Bauch, Becken, Oberschenkel)
  fallback: [bodycheck]
  default:
    - Befund: Bauch weich und schmerzfrei, Becken stabil, Oberschenkel ohne Schwellung.
  patterns:
    - trauma ?check
    - \btaste? (\w+ ){0,3}ab\b      # „ich taste sie ab“
    - abtast
    - \bbauch\b|abdomen
    - becken
    - oberschenkel
    - innere blutung
  examples:
    - Ich taste den Bauch, das Becken und die Oberschenkel ab

schocklage:
  label: Schocklage / flach lagern
  patterns:
    - schocklage
    - beine (hoch|anheben|hochlagern|erhöht|hochlegen)
    - flach (hin)?(legen|lagern|hinlegen)|flachlage|flache lagerung
    - (hin)?legen (sie sich|wir (sie|ihn))
  examples:
    - Wir legen sie flach hin und machen die Beine hoch
  default:
    - Befund: (liegt jetzt flach, Beine erhöht)

nicht_aufstehen:
  label: Nicht aufstehen lassen
  patterns:
    - nicht (auf)?stehen|nicht aufsetzen
    - (stehen sie|steh|steht) (bitte |jetzt |noch )*nicht auf
    - (bleiben sie|bleib) (bitte )?(liegen|sitzen|ruhig liegen)
    - liegen bleiben|sitzen bleiben
  examples:
    - Bitte bleiben Sie liegen und stehen Sie nicht auf
  default:
    - Patient: Okay …

# ---------------------------------------------------------------- D
orientierung:
  label: Orientierung (Person, Ort, Zeit, Situation)
  unconscious:
    - Befund: (keine Reaktion)
  patterns:
    - wie heissen (sie|du)|wie heisst du|ihr name|dein name|wie ist ihr name
    - wo (sind|bist) (sie|du|wir)|wissen sie,? wo
    - welche?r? (tag|datum|jahr|monat|wochentag)|welches jahr
    - wissen sie,? (was|welcher|wie spät)
    - orientier
    - geburtsdatum|geburtstag
  examples:
    - Wie heißen Sie und wissen Sie, wo wir gerade sind?
    - Welcher Tag ist heute?

alter_fragen:
  label: Nach dem Alter gefragt
  patterns:
    - wie alt (sind sie|bist du|ist er|ist sie|ist der|ist die)
    - (ihr|dein|sein) alter
    - alter\?
  examples:
    - Wie alt sind Sie denn?
  unconscious:
    - Umstehende: Keine Ahnung, wie alt er ist.

reaktion:  # 1. Minute: nur „Reaktion angemessen?“ – Orientierung, GCS, BE-FAST kommen im D
  label: Reaktion beurteilt (angemessen?)
  fallback: [gcs]
  unconscious:
    - Befund: (keine Reaktion)
  patterns:
    - reaktion (ist |wirkt |scheint )?(angemessen|adäquat|adaequat|passend|unangemessen|verzögert|verlangsamt|ok|okay|in ordnung)
    - (angemessene|adäquate|adaequate|unangemessene|verzögerte|verlangsamte) reaktion
    - reagiert (er|sie|der patient|die patientin)? ?(angemessen|adäquat|adaequat|passend|unangemessen|verzögert|verlangsamt|normal|komisch|seltsam)
    - wie reagiert (er|sie)
  examples:
    - Reagiert er angemessen?
    - Die Reaktion ist angemessen

gcs:
  label: Bewusstseinslage (GCS / AVPU)
  patterns:
    - \bgcs\b|glasgow
    - avpu
    - bewusstsein|bewusstseinslage
    - (ist|wirkt) (er|sie) (wach|ansprechbar)
    - ansprechbar
  examples:
    - Wie ist die Bewusstseinslage?
    - Er ist wach und ansprechbar

pupillen:
  label: Pupillen
  patterns:
    - pupille
    - lichtreaktion|leuchte
  examples:
    - Ich leuchte mit der Lampe in die Augen

bz:
  label: Blutzucker gemessen
  patterns:
    - blutzucker
    - \bbz\b
    - zucker (messen|mess|kontrollieren|bestimmen|testen)|zucker ?wert
    - (mess|bestimm)\w* (den |mal )?zucker
  examples:
    - Ich messe den Blutzucker

fast:
  label: BE-FAST (Balance, Augen, Gesicht, Arme, Sprache, Zeit)
  default:
    - Befund: Gesicht symmetrisch, beide Arme werden gleich gehalten, Sprache klar.
  unconscious:
    - Befund: (keine Reaktion)
  patterns:
    - \bfast\b|be-?fast
    - lächeln
    - arme? (heben|vorhalten|ausstrecken|nach vorne)
    - armvorhalte
    - sprechen sie (mir )?nach|nachsprechen
    - halbseit
    - gesicht\w* (symmetr|hängt|schief)
    - mundwinkel
    - zähne zeigen|backen aufblasen
    - gleichgewicht|schwindel\w* beim (stehen|gehen)|gangunsicher|balance
    - sehstörung|sehstoerung|doppelbilder|gesichtsfeld|verschwommen|(können|kannst) (sie|du) (gut|normal|alles|richtig) sehen|(sehen sie|siehst du) (gut|normal|alles|doppelt|richtig)
    - finger ?folgen|meinem finger
  examples:
    - Können Sie einmal lächeln und beide Arme nach vorne strecken?

glukose_geben:
  label: Zucker / Trinken angeboten
  unconscious:
    - Kollege: Er ist bewusstlos – nichts in den Mund.
  default:
    - Patient: (trinkt einen Schluck) Danke.
  patterns:
    - traubenzucker
    - (zucker|glukose|glucose|saft|cola|limo|wasser)\w* (geben|anbieten|trinken)
    - (gebe|geben|biete|bieten) (ihnen |ihr |ihm |dir )?(etwas |was |einen? )?(zucker|traubenzucker|saft|cola|wasser|trinken)
    - (etwas|was) (zu )?trinken
    - zucker ?gel|was süsses
  examples:
    - Ich gebe ihr Traubenzucker und etwas Saft
    - Möchten Sie etwas trinken?

krampf_dauer:
  label: Dauer des Anfalls erfasst
  default:
    - Umstehende: Seit ein paar Minuten.
  fallback: [was_passiert]
  patterns:
    - wie lange (krampft|dauert|zuckt) (er|sie|es|der anfall|das)
    - seit wann (krampft|zuckt)
    - (anfalls|krampf)dauer
  examples:
    - Seit wann krampft er? Ich merke mir die Uhrzeit

uhrzeit_notieren:  # z. B. wann das Tourniquet angelegt wurde – gehört in die Übergabe; im Krampf-Fall die Anfallsdauer
  label: Uhrzeit notiert
  fallback: [krampf_dauer]
  overrides: [symptombeginn, krampf_dauer]
  patterns:
    - (uhr)?zeit (stoppen|merken|notieren|nehmen|festhalten|aufschreiben)
    - (merk|notier|schreib|stopp|nimm|nehme)\w* (dir |mal |bitte |jetzt )*(die )?(uhr)?zeit
    - (uhr)?zeit (\w+ ){0,2}(auf|an) (das |dem |den )?tourniquet
    - (auf|aufs) (das |den )?tourniquet (\w+ ){0,2}schreib
  examples:
    - Kollege, merk dir die Uhrzeit
    - Notier bitte die Uhrzeit vom Tourniquet
    - Schreib die Uhrzeit auf das Tourniquet
  default:
    - Kollege: (notiert die Uhrzeit)

symptombeginn:  # das „T“ in BE-FAST: Zeitfenster für die Behandlung (Schlaganfall), Krampfdauer, Beginn der Beschwerden
  label: Symptombeginn erfragt (Uhrzeit)
  fallback: [krampf_dauer, was_passiert]   # ohne eigene Antwort: Krampfdauer bzw. Hergang
  patterns:
    - seit wann
    - uhrzeit
    - symptombeginn|beginn der (symptome|beschwerden)|zeitfenster
    - wann (genau )?(hat|haben|ist|fing|war) .{0,30}(angefangen|begonnen|aufgetreten|passiert|los|bemerkt)
    - wann (genau )?(hat|haben) (das|es|die beschwerden|die symptome)
    - wie lange (ist das|geht das|hat er das|hat sie das|haben sie das) schon
    - wann (haben sie|hast du) (ihn|sie|es) (zuletzt )?(normal|gesund) gesehen|zuletzt (normal|gesund) gesehen
  examples:
    - Seit wann ist das so?
    - Wann genau hat das angefangen?
    - Wann haben Sie ihn zuletzt gesund gesehen?

kopf_schuetzen:
  label: Während des Anfalls schützen (Kopf polstern, nichts in den Mund)
  patterns:
    - kopf (schützen|polstern|abpolstern|unterlegen)
    - polster
    - unter (den|seinen|ihren) kopf
    - nichts in den mund
    - gegenstände (weg|wegräumen|entfernen)
    - umfeld sichern
  examples:
    - Ich lege ihm die Jacke unter den Kopf und räume die Sachen weg
  default:
    - Kollege: (räumt Gegenstände weg und polstert den Kopf ab)

dms:
  label: Durchblutung, Motorik, Sensibilität (DMS)
  default:
    - Patient: Ja, ich spüre alles und kann alles bewegen.
  unconscious:
    - Befund: (keine Reaktion)
  patterns:
    - \bdms\b
    - spüren sie,? wo ich|spürst du,? wo ich
    - drücken sie (mal |bitte )*(meine |beide )*h(a|ä)nd
    - kribbel|taubheit|taub\b
    - (spüren|fühlen) sie (das|meine|mich|hier)
    - bewegen sie (mal |bitte )?(die|ihre) (finger|zehen|füsse|hände|beine)
    - (finger|zehen|füsse|hände|beine) bewegen
    - lähmung
    - gefühl in
  examples:
    - Spüren Sie, wo ich Sie berühre? Bewegen Sie mal die Zehen

# ---------------------------------------------------------------- E
frieren_fragen:
  label: Nach Frieren gefragt
  unconscious:
    - Befund: (keine Reaktion)
  patterns:
    - \bkalt\b|frier|frös?t|zitter
    - warm genug
    - (ist|wird) (ihnen|dir) (jetzt |schon |wieder |etwas |ein bisschen )*(wärmer|warm)
    - kühl\b
  examples:
    - Ist Ihnen kalt?
    - Frieren Sie?

decke:
  label: Wärmeerhalt (Decke / vom Boden isolieren)
  patterns:
    - decke
    - zudeck
    - wärmeerhalt|warm (halten|einpacken|zudecken)|wärmen
    - jacke (über|drüber|drauf)
    - isolier
    - (vom|gegen den) boden
    - isomatte|unterlage
    - einwickeln|einpacken
  examples:
    - Ich decke ihn mit der Rettungsdecke zu
    - Wir legen was unter ihn, damit er nicht auf dem kalten Boden liegt
  default:
    - Kollege: (holt die Rettungsdecke und hilft beim Zudecken)

nasse_kleidung:
  label: Nasse Kleidung entfernen
  patterns:
    - nasse? (kleidung|sachen|hose|jacke)
    - (kleidung|jacke|hose|sachen) (aus|ausziehen|entfernen|aufschneiden|öffne\w*)
    - (öffne|öffnen|öffnest|mach|machen)\w* (\w+ ){0,3}(jacke|kleidung|hemd|bluse|gürtel|kragen|hose)( auf)?\b
    - ausziehen|aufschneiden|entkleiden|auskleiden
  examples:
    - Wir schneiden die nasse Kleidung auf
  default:
    - Kollege: (hilft, die Kleidung zu öffnen)

kleidung_belassen:
  label: Angeschmolzene Kleidung belassen
  overrides: [nasse_kleidung]
  patterns:
    - nicht (ab)?reissen
    - (kleben|dran|drauf) lassen
    - angeschmolzen
    - (kleidung|jacke|ärmel) (belassen|lassen)
  examples:
    - Die angeschmolzene Jacke lassen wir dran
  default:
    - Kollege: (lässt das angeschmolzene Material auf der Haut)

kuehlen:
  label: Kühlen
  patterns:
    - \b(ab)?kühl(en|ung)\b|kühle (ich|den|die|das|wir)   # nicht „auskühlen“, „Unterkühlung“
    - kühlpack|kältepack|coolpack
    - (lauwarm\w*|kalt\w*)? ?wasser (drüber|darüber|laufen|auf)
    - ablöschen
  examples:
    - Ich kühle den Arm mit lauwarmem Wasser
  default:
    - Kollege: (holt ein Kühlpack aus dem Rucksack und kühlt)

auge:
  label: Auge versorgt (nicht reiben, spülen/abdecken)
  default:
    - Befund: Keine Verletzung an den Augen, beide Pupillen seitengleich.
  patterns:
    - auge\w* (spülen|ausspülen|abdecken|anschauen|ansehen|untersuchen|verbinden)
    - (spüle|spülen|decke)\w* (\w+ ){0,3}auge
    - wie (gut )?sehen sie (auf|links|rechts|mit)
    - (nicht|bitte nicht) (am auge )?reiben
    - augen ?(spülung|verband|klappe)
    - visus|sehen sie (gut|etwas|was|mich)|können sie sehen
  examples:
    - Nicht am Auge reiben, ich spüle das vorsichtig aus

bodycheck:
  label: Ganzkörperuntersuchung
  fallback: [trauma_check]
  default:
    - Befund: Keine weiteren Verletzungen zu finden.
  patterns:
    - body ?check
    - ganzkörper
    - (von )?kopf bis fuss
    - (weitere|andere|sonstige) verletzung
    - sonst (noch )?(verletzt|verletzungen|etwas)
    - untersuch\w* (sie|ihn|dich) (komplett|ganz|von oben)
  examples:
    - Ich untersuche Sie jetzt einmal von Kopf bis Fuß
    - Ich untersuche ihn
    - Ich untersuche Sie
    - Haben Sie sich sonst noch verletzt?

temperatur:
  label: Körpertemperatur gemessen
  fallback: [frieren_fragen]
  patterns:
    - temperatur
    - thermometer
    - fieber
  examples:
    - Ich messe die Temperatur im Ohr

wunde_versorgen:
  label: Wunde versorgt (steriler Verband)
  patterns:
    - verband|verbind\w*        # „verbinden“, „verbinde die Wunde“
    - wundauflage|kompresse|pflaster
    - steril
    - wunde (abdecken|versorgen)
    - versorg\w* (\w+ ){0,3}\w*wunde
    - \w*wunde (\w+ ){0,2}(versorg|verbind|abdeck)
  examples:
    - Ich lege einen sterilen Verband auf die Wunde
  default:
    - Kollege: (versorgt die Wunde mit einem sterilen Verband)

immobilisieren:
  label: Immobilisation (Stifneck, Vakuummatratze, Schiene)
  patterns:
    - stifneck|stiffneck|halskrause|stützkragen|zervikal|cervical
    - vakuum
    - schaufeltrage|spineboard
    - immobilis
    - schien
    - ruhigstell
  examples:
    - Wir legen den Halskragen an und nehmen die Vakuummatratze
  default:
    - Kollege: (holt Stifneck bzw. Schiene und legt sie mit an)

hws_manuell:
  label: Manuelle HWS-Stabilisierung
  patterns:
    - \bhws\b
    - halswirbel
    - kopf (fest|ruhig)? ?(halten|fixieren|stabilisieren)
    - (halt|halte|fixier|stabilisier)\w* (bitte |mal )?(den )?kopf
    - manuell\w* (fixier|stabilis|immobil)
    - (übernimm|nimm|halt)\w* (\w+ ){0,2}(den )?kopf
    - nicht den kopf bewegen|kopf nicht bewegen
    - h(ä|a)lt\w* (\w+ ){0,3}kopf (fest|ruhig)
    - (fixier|stabilisier)\w* (\w+ ){0,2}(den )?kopf
  examples:
    - Kannst du bitte den Kopf festhalten?
    - Kollege, übernimm die Halswirbelsäule
  default:
    - Kollege: (kniet sich hinter den Kopf und übernimmt die manuelle HWS-Stabilisierung)

# ---------------------------------------------------------------- SAMPLER
# Symptome (beschwerden_fragen), Allergien, Medikamente, Patientenvorgeschichte,
# Letzte Mahlzeit/Stuhlgang, Ereignis (was_passiert), Risikofaktoren
sample:
  label: SAMPLER-Anamnese
  patterns:
    - \bsampler?\b
  examples:
    - Ich mache jetzt die SAMPLER-Anamnese
  default:
    - Kollege: Was fragst du genau?

sample_allergie:
  label: Allergien
  patterns:
    - allergi
    - unverträglich
  examples:
    - Sind Allergien bekannt?

sample_medikamente:
  label: Medikamente
  patterns:
    - medikament|medis\b|tablette|\bpillen?\b
    - (nehmen|nimmst) (sie|du) (regelmässig )?(etwas|was)
    - blutverdünn|gerinnungshemm|marcumar
  examples:
    - Nehmen Sie regelmäßig Medikamente?

sample_vorerkrankung:
  label: Vorerkrankungen
  patterns:
    - vorerkrank
    - (bekannte |andere )?(krankheiten|erkrankungen)
    - krankengeschichte
    - (sind sie|bist du) (irgendwie )?(krank|in behandlung)
    - herz(probleme|krank|erkrank)
  examples:
    - Haben Sie Vorerkrankungen?
    - Sind Sie sonst gesund?

sample_mahlzeit:
  label: Letzte Mahlzeit / Stuhlgang / Wasserlassen
  patterns:
    - stuhlgang|stuhl\b|wasserlassen|urin|ausscheidung|auf (der )?toilette
    - gegessen|getrunken
    - letzte (mahlzeit|nahrung|essen)
    - mahlzeit
    - alkohol
    - was (haben sie|hast du) (heute )?(gegessen|getrunken)
  examples:
    - Wann haben Sie zuletzt etwas gegessen?

sample_risiko:
  label: Risikofaktoren
  patterns:
    - risikofaktor
    - rauchen sie|rauchst du|raucher
    - schwanger
    - (in der )?familie\w*|familiär|erblich|vererb
    - übergewicht
  examples:
    - Gibt es Herzerkrankungen in Ihrer Familie?
    - Rauchen Sie?
  default:
    - Patient: Nicht dass ich wüsste.
  unconscious:
    - Umstehende: Weiß ich nicht.

# ---------------------------------------------------------------- Bewusstlosigkeit / Reanimation
atemkontrolle:
  label: Atemkontrolle (sehen, hören, fühlen)
  fallback: [af_zaehlen, atmung_fragen]   # beim Wachen: Befund zur Atmung
  unconscious:   # im Verlauf: Schnappatmung bzw. Kreislaufstillstand (Flags aus den Fällen)
    - when: {kreislaufstillstand: true}
      say:
        - Befund: Keine normale Atmung, nur vereinzelte schnappende Atemzüge.
    - when: {keine_normale_atmung: true}
      say:
        - Befund: Keine normale Atmung, nur vereinzelte schnappende Atemzüge.
  patterns:
    - atemkontrolle
    - atmet (er|sie|der|die|das kind)\b
    - (sehen|schauen),? hören,? fühlen
    - atmung (prüfen|kontrollieren|checken|überprüfen)|prüfe (die )?atmung
    - (prüf|check|kontrollier)\w* (\w+ ){0,2}atmung
    - (hebt|senkt) sich (der )?brustkorb|brustkorb (hebt|bewegt)
    - schnappatmung
    - keine (normale )?atmung|atmet nicht
  examples:
    - Ich kontrolliere die Atmung, sehen, hören, fühlen, zehn Sekunden
    - Atmet er normal?

seitenlage:
  label: Stabile Seitenlage
  default:
    - Patient: Hinlegen? Ich bin doch wach.
  patterns:
    - seitenlage
    - auf die seite\b
  examples:
    - Ich bringe ihn in die stabile Seitenlage

hlw:
  label: Herzdruckmassage (HLW)
  not_indicated:   # HLW nur bei Bewusstlosigkeit ohne normale Atmung – sonst stoppt der Kollege, die Maßnahme zählt nicht
    - when: {wach: true}
      say:
        - Kollege: Stopp! Ansprechbar und atmet – keine Herzdruckmassage!
    - say:
        - Kollege: Stopp! Da ist noch normale Atmung – keine Herzdruckmassage!
  patterns:
    - (?<!keine )(?<!kein )\bhlw\b|\bcpr\b
    - (?<!keine )(?<!keiner )(?<!ohne )herzdruck|(?<!keine )(?<!herz)druckmassage
    - (?<!keine )(?<!nicht )(?<!kein )reanim
    - (?<!keine )(?<!nicht )wiederbeleb
    - 30 ?(zu|:) ?2|dreissig zu zwei
    - thoraxkompression
    - (beginne|beginnen|fange|starte) (\w+ )?(mit dem )?drücken
    - weiter drücken|drücke weiter|weiter (mit der )?(hlw|herzdruckmassage)
    - \b\d{1,2}\W+\d{1,2}\W+\d{1,2}\W+\d{1,2}\b          # lautes Zählen „1 2 3 4 …“
    - \b(eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zwanzig|dreissig)\W+(eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zwanzig|dreissig)\W+(eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zwanzig|dreissig)\W+(eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zwanzig|dreissig)\b   # „… fünf sechs sieben acht …“
    - \b(8|acht|28|achtundzwanzig)\W+(9|neun|29|neunundzwanzig)\W+(30|dreissig)\b
  examples:
    - Ich beginne sofort mit der Herzdruckmassage
    - Wir machen weiter mit Drücken
  default:
    - Befund: (die Herzdruckmassage läuft)

hlw_zaehlen:
  label: Kompressionen laut gezählt
  # gängig ist die Kurzform „… 10 … 20 … 5, 6, 7, 8, 9, 30“
  not_indicated:   # HLW nur bei Bewusstlosigkeit ohne normale Atmung – sonst stoppt der Kollege, die Maßnahme zählt nicht
    - when: {wach: true}
      say:
        - Kollege: Stopp! Ansprechbar und atmet – keine Herzdruckmassage!
    - say:
        - Kollege: Stopp! Da ist noch normale Atmung – keine Herzdruckmassage!
  patterns:
    - \b\d{1,2}\W+\d{1,2}\W+\d{1,2}\W+\d{1,2}\b
    - \b(eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zwanzig|dreissig)\W+(eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zwanzig|dreissig)\W+(eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zwanzig|dreissig)\W+(eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|zwanzig|dreissig)\b
  default:
    - say: []

hlw_30:
  label: Bis 30 gezählt (dann 2 Beatmungen)
  implies: [hlw_zaehlen]
  not_indicated:   # HLW nur bei Bewusstlosigkeit ohne normale Atmung – sonst stoppt der Kollege, die Maßnahme zählt nicht
    - when: {wach: true}
      say:
        - Kollege: Stopp! Ansprechbar und atmet – keine Herzdruckmassage!
    - say:
        - Kollege: Stopp! Da ist noch normale Atmung – keine Herzdruckmassage!
  patterns:
    - \b(8|acht|28|achtundzwanzig)\W+(9|neun|29|neunundzwanzig)\W+(30|dreissig)\b   # „28 29 30“ oder Kurzform „8 9 30“
  default:
    - Kollege: (gibt zwei Beatmungen mit dem Beutel)
    - Befund: (der Brustkorb hebt sich zweimal)

hlw_details:
  label: HLW korrekt (Druckpunkt, Tiefe, Frequenz)
  default:
    - say: []
  patterns:
    - druckpunkt
    - mitte (des |vom )?brustkorb|brustbein|brustmitte
    - (5|fünf) bis (6|sechs)|zentimeter|\bcm\b
    - (100|hundert) bis (120|hundertzwanzig)|druckfrequenz|frequenz (von )?(100|hundert)
    - entlast
  examples:
    - Druckpunkt Mitte Brustkorb, fünf bis sechs Zentimeter tief, hundert bis hundertzwanzig pro Minute

beatmen:
  label: Beatmung
  patterns:
    - beatm
    - (?<!an den )(?<!am )(?<!an )beutel   # „Sauerstoff an den Beutel“ ist keine Beatmung
    - (zwei|2) (atemspenden|beatmungen)|atemspende
  examples:
    - Jetzt zwei Beatmungen mit dem Beutel
  default:
    - Befund: (der Brustkorb hebt sich bei der Beatmung)

aed:
  label: AED geholt / angelegt
  patterns:
    - \baed\b|\bdefi
    - elektrode|pads? (kleben|aufkleben|anbringen|drauf)
  examples:
    - Hol bitte den Defibrillator und klebe die Elektroden auf
  default:
    - Kollege: (holt den AED und schaltet ihn ein)

schock_ausloesen:
  label: Schock ausgelöst
  default:
    - Kollege: Der AED ist gar nicht angeschlossen.
  not_indicated:
    - when: {wach: true}
      say:
        - Kollege: Stopp! Die Person ist wach – da wird kein Schock ausgelöst!
    - say:
        - Kollege: Stopp! Da ist noch normale Atmung – kein Schock!
  patterns:
    - (?<!kein )\bschock\b(?! (empfohlen|wird))   # „Schock! Alle weg!“
    - schock\w* (aus|ab)?lös|lös\w* (den )?schock|schock (aus|ab)geben|schockknopf|schocktaste
    - (knopf|taste) drücken
    - schock (abgeben|geben|auslösen)
  examples:
    - Ich löse den Schock aus

schock_warnung:
  label: Warnung vor dem Schock („Alle weg!“)
  patterns:
    - alle (weg|zurück|los ?lassen)
    - (weg|hände weg) vom patienten
    - (niemand|keiner) (berührt|fasst)|nicht (mehr )?berühren|nicht anfassen
    - sauerstoff weg
    - achtung,? schock
  examples:
    - Achtung, alle weg vom Patienten, niemand berührt ihn!
  default:
    - Umstehende: (treten zurück)

helferwechsel:
  label: Helferwechsel
  patterns:
    - wechsel
    - (abwechseln|ablösen|löse dich ab|übernimm (das|die) drücken)
    - \bdu drückst\b
  examples:
    - Wechsel, du drückst jetzt
  default:
    - Kollege: (übernimmt die Herzdruckmassage)

# ---------------------------------------------------------------- Team / Nachforderung / Verlauf
teambesprechung:
  label: Teambesprechung (Lage, Verdachtsdiagnose, Notarzt)
  exclusive: true   # wer zusammenfasst, handelt nicht – erwähnte Befunde lösen keine Antworten aus
  patterns:
    - teambesprechung|team ?time|team ?talk
    - kurze (besprechung|rückmeldung)
    - zusammengefasst|zusammenfassung|fasse zusammen
    - verdacht|verdachtsdiagnose
    - ich (denke|vermute|glaube),? (es ist|er hat|sie hat|das ist|wir haben)
    - \b[abcde]-?problem
    - (brauchen|benötigen) wir (einen |den )?(notarzt|nef)
    - notarzt (nötig|notwendig|ja|nein|brauchen)
  examples:
    - Kurz zusammengefasst, Sturz mit Kopfanprall, Verdacht auf Schädel-Hirn-Trauma, wir brauchen den Notarzt
  default:
    - Kollege: Verstanden.

nachforderung:
  label: Rettungsdienst nachgefordert
  patterns:
    - \b112\b
    - notruf
    - nachforder|forder\w* (\w+ ){0,4}nach\b
    - (ruf|rufen|alarmier\w*) (sie |du )?(bitte )?(den |einen |die )?(rettungsdienst|rtw|notarzt|nef|leitstelle)
    - (wir brauchen|brauchen wir) (einen |den )?(rtw|rettungsdienst|rettungswagen)
  # bewusst ohne examples: nur eindeutige Stichworte (RTW, Notruf …) zählen
  default:
    - Kollege: (setzt über Funk die Nachforderung ab)

reevaluation:
  label: Reevaluation
  default:
    - Kollege: Was genau kontrollierst du?
  patterns:
    - reevalu|re-evalu
    - (nochmal|noch mal|noch einmal|erneut|wieder) (\w+ ){0,3}(messen|prüfen|kontrollieren|schauen|checken|untersuchen)
    - (kontrolliere|prüfe|messe|checke) (\w+ ){0,2}(nochmal|noch mal|noch einmal|erneut)
    - wieder bei a|von vorne (anfangen|beginnen)|zurück zu a
    - verlaufskontrolle
  examples:
    - Ich kontrolliere jetzt nochmal alle Werte

aufklaeren:
  label: Aufklärung / Transport besprochen
  # Wer aufklärt, erklärt – erwähnte Befunde („wegen des Blutverdünners …“) lösen keine eigenen Antworten aus
  exclusive: true
  patterns:
    - ins krankenhaus|in die klinik|in die notaufnahme|im krankenhaus
    - abklären|abklärung
    - (mitfahren|mitkommen|mitnehmen)
    - ablehn|verweiger|unterschreib|einwillig
    - (wir empfehlen|ich empfehle|ich rate|ich würde (ihnen|dir) raten)
    - risiko
    - nach hause
    - lass\w* (sie |du )?(sich |dich )?(\w+ ){0,2}(untersuchen|anschauen|ansehen|checken|durchchecken)
    - (arzt|ärztin|klinik|krankenhaus|notarzt)\w* (\w+ ){0,4}(ansehen|anschauen|abklären|untersuchen|angucken)
    - muss sich (ein|eine|der|die) (arzt|ärztin)
    - (stunden|später) (\w+ ){0,4}(bluten|blutung)|(kann|könnte|können|droht) (\w+ ){0,5}nachblut\w*|nachblutungsrisiko|hirnblutung|im kopf bluten|blutung im kopf
  examples:
    - Ich würde Ihnen dringend raten, das im Krankenhaus abklären zu lassen
    - Bitte lassen Sie sich untersuchen, das ist sicherer
  default:
    - Patient: Hm … wenn Sie meinen.

uebergabe:
  label: Übergabe an den Rettungsdienst
  exclusive: true   # Zusammenfassung, keine Handlung – wie die Teambesprechung (beide bleiben, die Engine entscheidet)
  patterns:
    - übergabe|übergebe|übergeben
    - (an|für) (den |die )?(rettungsdienst|kollegen vom rettungsdienst|notarzt)
  examples:
    - Übergabe an den Rettungsdienst, wir haben hier einen Patienten, Mitte sechzig
  default:
    - when: {rd_da: true}
      say:
        - Rettungsdienst: Danke, wir übernehmen.
      set: {uebergeben: true}
    - say:
        - Kollege: Der Rettungsdienst ist noch nicht da.

funk_anruf:
  label: Funk – Anruf der Leitstelle
funk_meldung:
  label: Funk – Meldung
funk_ende:
  label: Funk – Abschluss mit „Ende“
