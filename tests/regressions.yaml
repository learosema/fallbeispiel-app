# Regressionstests aus der Praxis: Sätze, die schon einmal falsch erkannt oder beantwortet wurden.
# Neue Fälle einfach unten anhängen. Felder (alle außer text optional):
#   text:      was gesagt/getippt wurde
#   expect:    Intents, die erkannt werden müssen
#   not:       Intents, die NICHT erkannt werden dürfen
#   scenario:  Fall-ID, wenn die Antwort geprüft werden soll (Standard: basis-sturz)
#   mode:      minute | full (Standard: minute)
#   reply:     Text, der in der Antwort der Simulation vorkommen muss
#   no_reply:  Text, der NICHT in der Antwort vorkommen darf
#   vague:     true/false – soll die Äußerung als vage Befundsprache gelten?
# Läuft zweimal: nur mit Regex (schnell) und mit dem Embedding-Modell (tests/test_embeddings.py).

# ---- Untersuchungen
- text: ich taste sie ab
  expect: [trauma_check]
  not: [bz, spo2]
- text: ich taste ihn mal ab
  expect: [trauma_check]
- text: schau mal nach den pupillen
  expect: [pupillen]
  not: [sample_medikamente]
- text: zähl mal die atemfrequenz
  expect: [af_zaehlen]
  not: [hlw_details]

# ---- Atmung: Beurteilung (Befund) vs. Frage an den Patienten
- text: Atmung?
  expect: [atmung_beurteilen]
  reply: Atmung ruhig und regelmäßig
  no_reply: Luft bekomme ich gut
- text: Kollege, wie beurteilst du die Atmung?
  expect: [atmung_beurteilen]
- text: Bekommen Sie gut Luft?
  expect: [atmung_fragen]
  reply: Luft bekomme ich gut
- text: Atmung?
  scenario: bw-reanimation
  reply: Keine normale Atmung
  no_reply: nichts Besonderes
- text: bekommen sie gut luft?
  scenario: bw-seitenlage
  reply: (keine Reaktion)

