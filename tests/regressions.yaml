  no_reply: Luft bekomme ich gut
- text: Kollege, wie beurteilst du die Atmung?
  expect: [atmung_beurteilen]
- text: Bekommen Sie gut Luft?
  expect: [atmung_fragen]
  reply: Luft bekomme ich gut
- text: Atmung?
  scenario: bw-reanimation
  reply: Keine normale Atmung
  no_reply: nichts Besonderes
- text: bekommen sie gut luft?
  scenario: bw-seitenlage
  reply: (keine Reaktion)

